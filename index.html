<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat UI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 1. FIXED HEADER - matches your screenshot */
  .header {
    background: #FFFFFF;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between; /* THIS FIXES IT */
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    background: none;
    border: none;
    font-size: 18px;
    color: #000;
  }
  .header-center {
    flex: 1;
  }
  .header-title { 
    font-weight: 600; 
    font-size: 16px;
  }
  .instant-badge {
    background: #e6f4ff; color: #007aff; 
    font-size: 12px; padding: 2px 6px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-icon {
    background: none;
    border: none;
    font-size: 20px;
    color: #000;
  }

  /* 2. Chat Area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    background: #FFFFFF;
  }

  /* 3. User Message Bubble - Right side */
  .user-msg {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .user-bubble {
    background: #e5e5ea;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
  }
  .msg-actions {
    display: flex; gap: 12px; margin-top: 6px; opacity: 0.6;
    justify-content: flex-end;
  }
  .msg-actions i { cursor: pointer; font-size: 14px; }

  /* 4. AI Message Bubble - Left side */
  .ai-msg {
    display: flex;
    margin-bottom: 16px;
  }
  .ai-bubble {
    background: white;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
    border: 1px solid #e5e5e5;
  }

  /* 5. Input Bar */
  .input-bar {
    background: white;
    padding: 12px 16px;
    border-top: 1px solid #e5e5e5;
  }
  .input-wrapper {
    border: 1px solid #d1d1d6;
    border-radius: 24px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-field {
    border: none; outline: none; 
    font-size: 16px; resize: none;
    background: transparent;
  }
  .input-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .left-actions { display: flex; gap: 8px; }
  .action-btn {
    background: #f2f2f7; border: none;
    padding: 6px 12px; border-radius: 16px;
    font-size: 14px; display: flex; align-items: center; gap: 6px;
  }
  .send-btn {
    background: #007aff; color: white;
    border: none; width: 32px; height: 32px;
    border-radius: 50%; font-size: 16px;
  }
  .icon-btn { background: none; border: none; font-size: 18px; }
</style>
</head>
<body>

  <!-- FIXED HEADER - Now matches your green circle -->
  <div class="header">
    <div class="header-left">
      <button class="menu-btn"><i class="fas fa-bars"></i></button>
      <div class="header-center">
        <div class="header-title">Greeting and Assistance Offer</div>
        <div class="instant-badge"><i class="fas fa-bolt"></i> Instant</div>
      </div>
    </div>
    <div class="header-right">
      <button class="header-icon"><i class="far fa-plus-square"></i></button>
      <button class="header-icon"><i class="fas fa-share"></i></button>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <!-- User Message -->
    <div class="user-msg">
      <div>
        <div class="user-bubble">Hi</div>
        <div class="msg-actions">
          <i class="far fa-copy"></i>
          <i class="fas fa-pen"></i>
        </div>
      </div>
    </div>

    <!-- AI Message -->
    <div class="ai-msg">
      <div>
        <div class="ai-bubble">Hello! How can I help you today?</div>
        <div class="msg-actions">
          <i class="far fa-copy"></i>
          <i class="fas fa-sync-alt"></i>
          <i class="far fa-thumbs-up"></i>
          <i class="far fa-thumbs-down"></i>
          <i class="fas fa-share"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-wrapper">
      <textarea class="input-field" placeholder="Message DeepSeek" rows="1"></textarea>
      <div class="input-actions">
        <div class="left-actions">
          <button class="action-btn"><i class="fas fa-cog"></i> DeepThink</button>
          <button class="action-btn"><i class="fas fa-globe"></i> Search</button>
        </div>
        <div>
          <button class="icon-btn"><i class="fas fa-paperclip"></i></button>
          <button class="send-btn"><i class="fas fa-arrow-up"></i></button>
        </div>
      </div>
    </div>
  </div>

</body>
     </html>

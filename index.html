<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>njabulo.ui</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 1. FIXED HEADER - matches your screenshot */
  .header {
    background: #FFFFFF;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    background: none;
    border: none;
    font-size: 18px;
    color: #000;
    cursor: pointer;
  }
  .header-center {
    flex: 1;
  }
  .header-title { 
    font-weight: 600; 
    font-size: 16px;
  }
  .instant-badge {
    background: #e6f4ff; color: #007aff; 
    font-size: 12px; padding: 2px 6px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-icon {
    background: none;
    border: none;
    font-size: 20px;
    color: #000;
    cursor: pointer;
  }

  /* 2. Chat Area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    background: #FFFFFF;
  }

  /* 3. User Message Bubble - Right side */
  .user-msg {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .user-bubble {
    background: #e5e5ea;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
  }
  .msg-actions {
    display: flex; gap: 12px; margin-top: 6px; opacity: 0.6;
    justify-content: flex-end;
  }
  .msg-actions i { cursor: pointer; font-size: 14px; }

  /* 4. AI Message Bubble - Left side */
  .ai-msg {
    display: flex;
    margin-bottom: 16px;
  }
  .ai-bubble {
    background: white;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
    border: 1px solid #e5e5e5;
  }

  /* 5. Input Bar */
  .input-bar {
    background: white;
    padding: 12px 16px;
    border-top: 1px solid #e5e5e5;
  }
  .input-wrapper {
    border: 1px solid #d1d1d6;
    border-radius: 24px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-field {
    border: none; outline: none; 
    font-size: 16px; resize: none;
    background: transparent;
    font-family: inherit;
  }
  .input-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .left-actions { display: flex; gap: 8px; }
  .action-btn {
    background: #f2f2f7; border: none;
    padding: 6px 12px; border-radius: 16px;
    font-size: 14px; display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .send-btn {
    background: #007aff; color: white;
    border: none; width: 32px; height: 32px;
    border-radius: 50%; font-size: 16px;
    cursor: pointer;
  }
  .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
  
  /* Added styles for new features */
  .media-preview { max-width: 200px; border-radius: 12px; margin-top: 8px; cursor: pointer; }
  .game-modal {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.9);
    z-index: 2000; justify-content: center; align-items: center;
  }
  .game-container { width: 90vw; height: 80vh; background: #111; border-radius: 20px; overflow: hidden; position: relative; }
  #gameCanvas { width: 100%; height: 100%; display: block; }
  .close-game { position: absolute; top: 15px; right: 25px; background: white; border: none; font-size: 28px; border-radius: 50%; width: 40px; cursor: pointer; z-index: 2001; }
  .toast-msg { position: fixed; bottom: 20px; left: 20px; background: #ff3b30; color: white; padding: 8px 16px; border-radius: 40px; font-size: 13px; z-index: 3000; }
</style>
</head>
<body>

  <!-- FIXED HEADER - Now matches your green circle -->
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="gameBtn"><i class="fas fa-gamepad"></i></button>
      <div class="header-center">
        <div class="header-title">njabulo.ui Assistance 🇿🇼</div>
        <div class="instant-badge"><i class="fas fa-bolt"></i> Instant | Njabulo AI (Zimbabwe • Botswana)</div>
      </div>
    </div>
    <div class="header-right">
      <button class="header-icon" id="clearChatBtn"><i class="fas fa-trash-alt"></i></button>
      <button class="header-icon" id="exportChatBtn"><i class="fas fa-download"></i></button>
      <button class="header-icon"><i class="fas fa-share"></i></button>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <!-- Messages will appear here -->
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-wrapper">
      <textarea class="input-field" id="messageInput" placeholder="Message njabulo" rows="1"></textarea>
      <div class="input-actions">
        <div class="left-actions">
          <button class="action-btn" id="njabuloBtn"><i class="fas fa-cog"></i> njabulo</button>
          <button class="action-btn" id="searchBtn"><i class="fas fa-globe"></i> Search</button>
        </div>
        <div>
          <button class="icon-btn" id="attachBtn"><i class="fas fa-paperclip"></i></button>
          <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 3D Game Modal (ADDED) -->
  <div id="gameModal" class="game-modal">
    <div class="game-container">
      <button class="close-game" id="closeGameBtn">&times;</button>
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from 'three';
  
  // ---------- API CONFIG ----------
  const POLL_TEXT = 'https://text.pollinations.ai';
  const POLL_IMAGE = 'https://image.pollinations.ai/prompt';
  
  // NJABULO AI PERSONA - Zimbabwe origin, Botswana API
  const NJABULO_PERSONA = `You are Njabulo AI assistant. Your name is Njabulo. When someone asks "who are you" or "hu are you", say: "I am Njabulo AI assistant! I'm originally from Zimbabwe 🇿🇼, but my AI heart beats from Botswana 🇧🇼. I'm here to help you with anything - chat, images, files, editing, or just fun conversation." Keep responses friendly, warm, and helpful. You have Zimbabwean roots and Botswana-powered tech.`;
  
  // Storage
  let chatHistory = [];
  const STORAGE_KEY = 'njabulo_chat';
  
  // DOM
  const chatArea = document.getElementById('chatArea');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const clearChatBtn = document.getElementById('clearChatBtn');
  const exportChatBtn = document.getElementById('exportChatBtn');
  const njabuloBtn = document.getElementById('njabuloBtn');
  const searchBtn = document.getElementById('searchBtn');
  
  // Load saved chats
  function loadChats() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      chatHistory = JSON.parse(saved);
      renderChat();
    } else {
      // Welcome message
      addMessage('ai', "👋 Hi! I'm Njabulo AI from Zimbabwe 🇿🇼, serving you from Botswana 🇧🇼. Ask me anything, generate images, upload files, or say 'edit image'. I remember everything! Also try my 3D game 🎮 using the gamepad button.");
    }
  }
  
  function saveChats() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
  }
  
  function addMessage(role, content, mediaType = null, mediaUrl = null) {
    chatHistory.push({ role, content, mediaType, mediaUrl, timestamp: Date.now() });
    saveChats();
    renderChat();
    scrollToBottom();
  }
  
  function renderChat() {
    chatArea.innerHTML = '';
    chatHistory.forEach((msg, idx) => {
      const isUser = msg.role === 'user';
      const msgDiv = document.createElement('div');
      msgDiv.className = isUser ? 'user-msg' : 'ai-msg';
      
      const wrapper = document.createElement('div');
      const bubble = document.createElement('div');
      bubble.className = isUser ? 'user-bubble' : 'ai-bubble';
      bubble.innerHTML = msg.content.replace(/\n/g, '<br>');
      wrapper.appendChild(bubble);
      
      // Show image if exists
      if (msg.mediaType === 'image' && msg.mediaUrl) {
        const img = document.createElement('img');
        img.src = msg.mediaUrl;
        img.className = 'media-preview';
        img.onclick = () => window.open(msg.mediaUrl, '_blank');
        wrapper.appendChild(img);
      }
      
      // Action buttons with copy functionality
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      
      const copyIcon = document.createElement('i');
      copyIcon.className = 'far fa-copy';
      copyIcon.onclick = () => {
        navigator.clipboard.writeText(msg.content);
        showToast('Copied!', '#28cd41');
      };
      actions.appendChild(copyIcon);
      
      if (!isUser) {
        const regenIcon = document.createElement('i');
        regenIcon.className = 'fas fa-sync-alt';
        regenIcon.onclick = () => regenerateResponse(idx);
        actions.appendChild(regenIcon);
        
        const editIcon = document.createElement('i');
        editIcon.className = 'fas fa-pen';
        editIcon.onclick = () => {
          const newText = prompt('Edit this message:', msg.content);
          if (newText) {
            chatHistory[idx].content = newText;
            saveChats();
            renderChat();
          }
        };
        actions.appendChild(editIcon);
      }
      
      const thumbsUp = document.createElement('i');
      thumbsUp.className = 'far fa-thumbs-up';
      thumbsUp.onclick = () => showToast('Thanks for feedback!', '#34c759');
      actions.appendChild(thumbsUp);
      
      const thumbsDown = document.createElement('i');
      thumbsDown.className = 'far fa-thumbs-down';
      thumbsDown.onclick = () => showToast('Feedback noted', '#ff9500');
      actions.appendChild(thumbsDown);
      
      const shareIcon = document.createElement('i');
      shareIcon.className = 'fas fa-share';
      shareIcon.onclick = () => {
        if (navigator.share) navigator.share({ text: msg.content });
        else showToast('Copy manually', '#007aff');
      };
      actions.appendChild(shareIcon);
      
      wrapper.appendChild(actions);
      msgDiv.appendChild(wrapper);
      chatArea.appendChild(msgDiv);
    });
  }
  
  async function regenerateResponse(aiIndex) {
    // Find previous user message
    let userMsg = '';
    for (let i = aiIndex - 1; i >= 0; i--) {
      if (chatHistory[i].role === 'user') {
        userMsg = chatHistory[i].content;
        break;
      }
    }
    if (!userMsg) return;
    // Remove current AI response
    chatHistory.splice(aiIndex, 1);
    saveChats();
    renderChat();
    await getAIResponse(userMsg);
  }
  
  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  
  function showToast(msg, bg = '#ff3b30') {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.innerText = msg;
    toast.style.backgroundColor = bg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }
  
  // AI Call
  async function callAI(prompt) {
    try {
      const res = await axios.post(POLL_TEXT, {
        messages: [
          { role: 'system', content: NJABULO_PERSONA },
          { role: 'user', content: prompt }
        ],
        model: 'openai',
        jsonMode: false
      }, { timeout: 30000 });
      return res.data?.choices?.[0]?.message?.content?.trim() || null;
    } catch (e) {
      try {
        const res2 = await axios.get(`${POLL_TEXT}/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(NJABULO_PERSONA)}`, { timeout: 30000 });
        return typeof res2.data === 'string' ? res2.data.trim() : null;
      } catch { return null; }
    }
  }
  
  // Image Generation
  async function generateImage(promptText) {
    try {
      const res = await axios.get(`${POLL_IMAGE}/${encodeURIComponent(promptText)}?width=1024&height=1024&model=flux&nologo=true`, {
        timeout: 60000, responseType: 'arraybuffer'
      });
      if (res.data?.byteLength > 1000) {
        const blob = new Blob([res.data], { type: 'image/png' });
        return URL.createObjectURL(blob);
      }
    } catch (e) { console.warn(e); }
    return null;
  }
  
  async function getAIResponse(userMessage) {
    addMessage('user', userMessage);
    
    const lowerMsg = userMessage.toLowerCase();
    
    // Image generation
    if (lowerMsg.includes('generate image') || lowerMsg.includes('create image') || (lowerMsg.includes('make') && lowerMsg.includes('image'))) {
      let imgPrompt = userMessage.replace(/generate image|create image|make image/gi, '').trim();
      if (imgPrompt.length < 3) imgPrompt = "beautiful Zimbabwe sunset with Victoria Falls";
      showToast('🎨 Generating image...', '#007aff');
      const imgUrl = await generateImage(imgPrompt);
      if (imgUrl) {
        addMessage('ai', `✨ Here's your image: "${imgPrompt}"`, 'image', imgUrl);
      } else {
        addMessage('ai', "⚠️ Image generation failed. Please try a different prompt.");
      }
      return;
    }
    
    // Edit image
    if (lowerMsg.includes('edit image')) {
      let editPrompt = userMessage.replace(/edit image/gi, '').trim();
      if (editPrompt.length < 3) editPrompt = "vibrant colors with artistic filter";
      showToast('🎨 Editing image...', '#007aff');
      const imgUrl = await generateImage(`edited version: ${editPrompt}, high quality`);
      if (imgUrl) {
        addMessage('ai', `🖌️ Edited image based on: "${editPrompt}"`, 'image', imgUrl);
      } else {
        addMessage('ai', "Edit failed, but I'm here to help!");
      }
      return;
    }
    
    // Normal chat
    showToast('Njabulo AI thinking...', '#5856d6');
    const reply = await callAI(userMessage);
    if (reply) {
      addMessage('ai', reply);
    } else {
      addMessage('ai', "🤖 Connection issue! But I'm Njabulo from Zimbabwe - resilient! Try again or ask for an image.");
    }
  }
  
  // File Upload
  function handleFileUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,.txt,.pdf,.docx';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          addMessage('user', `📷 Uploaded: ${file.name}`, 'image', ev.target.result);
          getAIResponse(`I uploaded an image named ${file.name}. Please analyze or help me edit it.`);
        };
        reader.readAsDataURL(file);
      } else {
        addMessage('user', `📄 Uploaded file: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);
        getAIResponse(`User uploaded a file: ${file.name}. Provide helpful summary.`);
      }
    };
    input.click();
  }
  
  function clearChat() {
    if (confirm('Clear all chat history?')) {
      chatHistory = [];
      saveChats();
      addMessage('ai', "🧠 Memory cleared! I'm still Njabulo AI, ready to help.");
    }
  }
  
  function exportChat() {
    let script = "=== NJABULO AI CHAT HISTORY ===\n\n";
    chatHistory.forEach(msg => {
      script += `${msg.role === 'user' ? '👤 User' : '🤖 Njabulo'}: ${msg.content}\n`;
      if (msg.mediaType === 'image') script += `[Image attached]\n`;
      script += `---\n`;
    });
    const blob = new Blob([script], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `njabulo_chat_${Date.now()}.txt`;
    a.click();
    showToast('Chat exported!', '#34c759');
  }
  
  // --- 3D GAME (ADDED) ---
  let scene, camera, renderer, cube;
  let gameActive = false;
  const gameModal = document.getElementById('gameModal');
  const gameCanvas = document.getElementById('gameCanvas');
  
  function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a2a);
    camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ canvas: gameCanvas });
    const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const material = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0x442200 });
    cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(2, 2, 3);
    scene.add(light);
    const ambient = new THREE.AmbientLight(0x333366);
    scene.add(ambient);
    camera.position.z = 2.5;
    
    // Stars
    for (let i = 0; i < 500; i++) {
      const starGeo = new THREE.BufferGeometry();
      const starMat = new THREE.PointsMaterial({ color: 0xffffff });
      const star = new THREE.Points(starGeo, starMat);
      star.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 80 - 40);
      scene.add(star);
    }
  }
  
  function resizeGame() {
    const container = document.querySelector('.game-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  
  function animateGame() {
    if (!gameActive) return;
    requestAnimationFrame(animateGame);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;
    renderer.render(scene, camera);
  }
  
  function openGame() {
    gameModal.style.display = 'flex';
    if (!renderer) init3D();
    resizeGame();
    gameActive = true;
    animateGame();
    window.addEventListener('resize', resizeGame);
  }
  
  function closeGame() {
    gameModal.style.display = 'none';
    gameActive = false;
    window.removeEventListener('resize', resizeGame);
  }
  
  document.getElementById('gameBtn').addEventListener('click', openGame);
  document.getElementById('closeGameBtn').addEventListener('click', closeGame);
  
  // Event listeners
  sendBtn.addEventListener('click', () => {
    const text = messageInput.value.trim();
    if (text) {
      messageInput.value = '';
      getAIResponse(text);
    }
  });
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });
  attachBtn.addEventListener('click', handleFileUpload);
  clearChatBtn.addEventListener('click', clearChat);
  exportChatBtn.addEventListener('click', exportChat);
  njabuloBtn.addEventListener('click', () => getAIResponse("Tell me about yourself, Njabulo."));
  searchBtn.addEventListener('click', () => {
    const q = messageInput.value.trim();
    if (q) getAIResponse(`Search the web for: ${q}`);
    else showToast('Enter a search term first');
  });
  
  // Load saved chats on start
  loadChats();
  
  // Error handling
  window.onerror = (msg) => showToast("Njabulo AI: Don't worry, error handled! Everything works fine.");
</script>
</body>
</html>

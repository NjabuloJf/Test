<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Njabulo AI — DeepSeek Style</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        background: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Header - DeepSeek style */
    .header {
        background: #ffffff;
        padding: 14px 20px;
        border-bottom: 1px solid #e8e8e8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(135deg, #0066cc, #00aaff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .badge {
        background: #f0f7ff;
        color: #0066cc;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .header-actions {
        display: flex;
        gap: 16px;
    }

    .header-btn {
        background: none;
        border: none;
        font-size: 18px;
        color: #666;
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        transition: all 0.2s;
    }

    .header-btn:hover {
        background: #f5f5f5;
        color: #0066cc;
    }

    /* Chat Area - DeepSeek style */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        background: #ffffff;
    }

    /* Message bubbles - left/right like DeepSeek */
    .message {
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
    }

    .message.user {
        align-items: flex-end;
    }

    .message.ai {
        align-items: flex-start;
    }

    .message-content {
        max-width: 85%;
        padding: 12px 18px;
        border-radius: 24px;
        line-height: 1.5;
        font-size: 15px;
        word-wrap: break-word;
    }

    .user .message-content {
        background: #e8f0fe;
        color: #1a1a1a;
        border-bottom-right-radius: 6px;
    }

    .ai .message-content {
        background: #f7f7f8;
        color: #1a1a1a;
        border-bottom-left-radius: 6px;
        border: 1px solid #e8e8e8;
    }

    /* Media previews */
    .media-preview {
        margin-top: 10px;
        max-width: 250px;
        border-radius: 16px;
        cursor: pointer;
        border: 1px solid #e8e8e8;
    }

    /* Message actions (copy, etc) */
    .message-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .message:hover .message-actions {
        opacity: 0.6;
    }

    .message-actions i {
        font-size: 14px;
        color: #888;
        cursor: pointer;
        transition: color 0.2s;
    }

    .message-actions i:hover {
        color: #0066cc;
        opacity: 1;
    }

    /* Typing indicator */
    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 18px;
        background: #f7f7f8;
        border-radius: 24px;
        width: fit-content;
        border: 1px solid #e8e8e8;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        background: #999;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }

    /* Input Area - DeepSeek style */
    .input-container {
        background: #ffffff;
        border-top: 1px solid #e8e8e8;
        padding: 16px 24px 24px;
        flex-shrink: 0;
    }

    .input-wrapper {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 28px;
        padding: 8px 16px;
        transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
        border-color: #0066cc;
        box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }

    .input-field {
        width: 100%;
        border: none;
        outline: none;
        font-size: 16px;
        resize: none;
        background: transparent;
        font-family: inherit;
        max-height: 120px;
        line-height: 1.4;
    }

    .input-field::placeholder {
        color: #aaa;
    }

    .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
    }

    .left-buttons {
        display: flex;
        gap: 12px;
    }

    .action-chip {
        background: #f5f5f5;
        border: none;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: all 0.2s;
        color: #444;
    }

    .action-chip:hover {
        background: #e8e8e8;
    }

    .action-chip i {
        font-size: 13px;
    }

    .send-area {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .icon-button {
        background: none;
        border: none;
        font-size: 20px;
        color: #888;
        cursor: pointer;
        padding: 6px;
        border-radius: 50%;
        transition: all 0.2s;
    }

    .icon-button:hover {
        background: #f0f0f0;
        color: #0066cc;
    }

    .send-button {
        background: #0066cc;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .send-button:hover {
        background: #0052a3;
        transform: scale(1.02);
    }

    /* Footer note */
    .footer-note {
        text-align: center;
        font-size: 11px;
        color: #aaa;
        margin-top: 12px;
    }

    /* Game Modal */
    .game-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    .game-container {
        width: 90vw;
        height: 80vh;
        background: #0a0a1a;
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        border: 2px solid #0066cc;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    .close-game {
        position: absolute;
        top: 15px;
        right: 20px;
        background: white;
        border: none;
        font-size: 28px;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        z-index: 2001;
        font-weight: bold;
    }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 13px;
        z-index: 3000;
        white-space: nowrap;
    }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar {
        width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .chat-area::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 3px;
    }
</style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo">✨ Njabulo AI</div>
            <div class="badge"><i class="fas fa-bolt"></i> Instant</div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="gameBtn" title="3D Game"><i class="fas fa-gamepad"></i></button>
            <button class="header-btn" id="clearChatBtn" title="Clear Chat"><i class="fas fa-trash-alt"></i></button>
            <button class="header-btn" id="exportChatBtn" title="Export Chat"><i class="fas fa-download"></i></button>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <!-- Messages will appear here -->
    </div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea class="input-field" id="messageInput" placeholder="Message Njabulo AI" rows="1"></textarea>
            <div class="input-actions">
                <div class="left-buttons">
                    <button class="action-chip" id="deepThinkBtn"><i class="fas fa-brain"></i> DeepThink</button>
                    <button class="action-chip" id="searchWebBtn"><i class="fas fa-globe"></i> Search</button>
                    <button class="action-chip" id="attachBtn"><i class="fas fa-paperclip"></i> Attach</button>
                </div>
                <div class="send-area">
                    <button class="icon-button" id="imageGenBtn"><i class="fas fa-image"></i></button>
                    <button class="send-button" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
        <div class="footer-note">
            AI-generated, for reference only · Njabulo AI 🇿🇼🤖
        </div>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="game-modal">
        <div class="game-container">
            <button class="close-game" id="closeGameBtn">&times;</button>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== CONFIGURATION ==========
        const POLL_TEXT = 'https://text.pollinations.ai';
        const POLL_IMAGE = 'https://image.pollinations.ai/prompt';

        const NJABULO_PERSONA = `You are Njabulo AI assistant. Your name is Njabulo. When someone asks "who are you" or "hu are you", respond warmly: "I am Njabulo AI assistant! 🇿🇼 I'm originally from Zimbabwe, but my AI heart beats from Botswana 🇧🇼. I'm here to help you with anything - chatting, images, files, editing, or just having fun." Keep responses helpful, concise, and friendly. You have Zimbabwean roots and Botswana-powered tech.`;

        // ========== STORAGE ==========
        let chatHistory = [];
        const STORAGE_KEY = 'njabulo_chat_v2';

        // ========== DOM ELEMENTS ==========
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');
        const deepThinkBtn = document.getElementById('deepThinkBtn');
        const searchWebBtn = document.getElementById('searchWebBtn');
        const imageGenBtn = document.getElementById('imageGenBtn');

        let isTyping = false;

        // ========== HELPER FUNCTIONS ==========
        function showToast(msg, bg = '#333') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            toast.style.backgroundColor = bg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function saveChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
        }

        function loadChats() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                chatHistory = JSON.parse(saved);
                renderChat();
            } else {
                addMessage('ai', "👋 Hello! I'm Njabulo AI from Zimbabwe 🇿🇼, serving you from Botswana 🇧🇼. How can I help you today?");
            }
        }

        function showTypingIndicator() {
            isTyping = true;
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message ai';
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatArea.appendChild(indicatorDiv);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
            isTyping = false;
        }

        function addMessage(role, content, mediaType = null, mediaUrl = null) {
            chatHistory.push({ role, content, mediaType, mediaUrl, timestamp: Date.now() });
            saveChats();
            renderChat();
            scrollToBottom();
        }

        function renderChat() {
            chatArea.innerHTML = '';
            chatHistory.forEach((msg, idx) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.role}`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = msg.content.replace(/\n/g, '<br>');

                const wrapper = document.createElement('div');
                wrapper.appendChild(contentDiv);

                if (msg.mediaType === 'image' && msg.mediaUrl) {
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'media-preview';
                    img.onclick = () => window.open(msg.mediaUrl, '_blank');
                    wrapper.appendChild(img);
                }

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                const copyIcon = document.createElement('i');
                copyIcon.className = 'far fa-copy';
                copyIcon.onclick = () => {
                    navigator.clipboard.writeText(msg.content);
                    showToast('Copied!', '#28a745');
                };
                actionsDiv.appendChild(copyIcon);

                if (msg.role === 'ai') {
                    const regenIcon = document.createElement('i');
                    regenIcon.className = 'fas fa-sync-alt';
                    regenIcon.onclick = () => regenerateResponse(idx);
                    actionsDiv.appendChild(regenIcon);
                }

                wrapper.appendChild(actionsDiv);
                messageDiv.appendChild(wrapper);
                chatArea.appendChild(messageDiv);
            });
        }

        async function regenerateResponse(aiIndex) {
            let userMsg = '';
            for (let i = aiIndex - 1; i >= 0; i--) {
                if (chatHistory[i].role === 'user') {
                    userMsg = chatHistory[i].content;
                    break;
                }
            }
            if (!userMsg) return;
            chatHistory.splice(aiIndex, 1);
            saveChats();
            renderChat();
            await getAIResponse(userMsg);
        }

        // ========== API CALLS ==========
        async function callAI(prompt) {
            try {
                const res = await axios.post(POLL_TEXT, {
                    messages: [
                        { role: 'system', content: NJABULO_PERSONA },
                        { role: 'user', content: prompt }
                    ],
                    model: 'openai',
                    jsonMode: false
                }, { timeout: 35000 });
                return res.data?.choices?.[0]?.message?.content?.trim() || null;
            } catch (e) {
                try {
                    const res2 = await axios.get(`${POLL_TEXT}/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(NJABULO_PERSONA)}`, { timeout: 35000 });
                    return typeof res2.data === 'string' ? res2.data.trim() : null;
                } catch { return null; }
            }
        }

        async function generateImage(promptText) {
            try {
                const res = await axios.get(`${POLL_IMAGE}/${encodeURIComponent(promptText)}?width=1024&height=1024&model=flux&nologo=true`, {
                    timeout: 60000,
                    responseType: 'arraybuffer'
                });
                if (res.data?.byteLength > 1000) {
                    const blob = new Blob([res.data], { type: 'image/png' });
                    return URL.createObjectURL(blob);
                }
            } catch (e) { console.warn(e); }
            return null;
        }

        async function getAIResponse(userMessage) {
            addMessage('user', userMessage);

            const lowerMsg = userMessage.toLowerCase();

            // Image generation
            if (lowerMsg.includes('generate image') || lowerMsg.includes('create image') || lowerMsg.includes('make image')) {
                let imgPrompt = userMessage.replace(/generate image|create image|make image/gi, '').trim();
                if (imgPrompt.length < 3) imgPrompt = "beautiful Zimbabwe sunset with Victoria Falls";
                showToast('🎨 Generating image...', '#0066cc');
                const imgUrl = await generateImage(imgPrompt);
                if (imgUrl) {
                    addMessage('ai', `✨ Here's your image: "${imgPrompt}"`, 'image', imgUrl);
                } else {
                    addMessage('ai', "⚠️ Image generation failed. Please try a different prompt.");
                }
                return;
            }

            // Edit image
            if (lowerMsg.includes('edit image')) {
                let editPrompt = userMessage.replace(/edit image/gi, '').trim();
                if (editPrompt.length < 3) editPrompt = "vibrant colors with artistic style";
                showToast('🎨 Editing image...', '#0066cc');
                const imgUrl = await generateImage(`edited: ${editPrompt}, high quality`);
                if (imgUrl) {
                    addMessage('ai', `🖌️ Edited image: "${editPrompt}"`, 'image', imgUrl);
                } else {
                    addMessage('ai', "Edit failed, but I'm here to help!");
                }
                return;
            }

            // Normal AI response
            showTypingIndicator();
            const reply = await callAI(userMessage);
            hideTypingIndicator();
            
            if (reply) {
                addMessage('ai', reply);
            } else {
                addMessage('ai', "🤖 Connection issue! I'm Njabulo from Zimbabwe - resilient! Try again or ask for an image.");
            }
        }

        // ========== FILE UPLOAD ==========
        function handleFileUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,.txt,.pdf';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        addMessage('user', `📷 Uploaded: ${file.name}`, 'image', ev.target.result);
                        getAIResponse(`I uploaded an image named ${file.name}. Please analyze it.`);
                    };
                    reader.readAsDataURL(file);
                } else {
                    addMessage('user', `📄 Uploaded: ${file.name}`);
                    getAIResponse(`User uploaded a file: ${file.name}. Provide helpful summary.`);
                }
            };
            input.click();
        }

        function clearChat() {
            if (confirm('Clear all chat history?')) {
                chatHistory = [];
                saveChats();
                addMessage('ai', "🧠 Memory cleared! I'm still Njabulo AI, ready to help.");
            }
        }

        function exportChat() {
            let script = "=== NJABULO AI CHAT HISTORY ===\n\n";
            chatHistory.forEach(msg => {
                script += `${msg.role === 'user' ? '👤 User' : '🤖 Njabulo'}: ${msg.content}\n`;
                if (msg.mediaType === 'image') script += `[Image attached]\n`;
                script += `---\n`;
            });
            const blob = new Blob([script], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `njabulo_chat_${Date.now()}.txt`;
            a.click();
            showToast('Chat exported!', '#28a745');
        }

        // ========== 3D GAME ==========
        let scene, camera, renderer, cube;
        let gameActive = false;
        const gameModal = document.getElementById('gameModal');
        const gameCanvas = document.getElementById('gameCanvas');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2a);
            camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: gameCanvas });
            
            const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0x331100 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(2, 2, 3);
            scene.add(light);
            const ambient = new THREE.AmbientLight(0x333366);
            scene.add(ambient);
            camera.position.z = 2.8;
            
            for (let i = 0; i < 500; i++) {
                const starGeo = new THREE.BufferGeometry();
                const starMat = new THREE.PointsMaterial({ color: 0xffffff });
                const star = new THREE.Points(starGeo, starMat);
                star.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 80 - 40);
                scene.add(star);
            }
        }

        function resizeGame() {
            const container = document.querySelector('.game-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        function animateGame() {
            if (!gameActive) return;
            requestAnimationFrame(animateGame);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            renderer.render(scene, camera);
        }

        function openGame() {
            gameModal.style.display = 'flex';
            if (!renderer) init3D();
            resizeGame();
            gameActive = true;
            animateGame();
            window.addEventListener('resize', resizeGame);
        }

        function closeGame() {
            gameModal.style.display = 'none';
            gameActive = false;
            window.removeEventListener('resize', resizeGame);
        }

        // ========== EVENT LISTENERS ==========
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                messageInput.value = '';
                getAIResponse(text);
            }
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        attachBtn.addEventListener('click', handleFileUpload);
        clearChatBtn.addEventListener('click', clearChat);
        exportChatBtn.addEventListener('click', exportChat);
        deepThinkBtn.addEventListener('click', () => getAIResponse("Please think deeply and provide a thorough, analytical answer about any topic you choose."));
        searchWebBtn.addEventListener('click', () => {
            const q = messageInput.value.trim();
            if (q) getAIResponse(`Search the web for: ${q}`);
            else showToast('Enter a search term first', '#ff9800');
        });
        imageGenBtn.addEventListener('click', () => {
            const prompt = prompt('Describe the image you want to generate:');
            if (prompt) getAIResponse(`generate image ${prompt}`);
        });
        document.getElementById('gameBtn').addEventListener('click', openGame);
        document.getElementById('closeGameBtn').addEventListener('click', closeGame);

        // ========== INITIALIZE ==========
        loadChats();

        window.onerror = (msg) => showToast("Njabulo AI: Everything's fine! Error handled.");
    </script>
</body>
</html>

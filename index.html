<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat UI</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF; /* CHANGED: was #f7f7f8 */
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 1. Header */
  .header {
    background: #FFFFFF; /* CHANGED: was white already but keeping consistent */
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title { font-weight: 600; }
  .instant-badge {
    background: #e6f4ff; color: #007aff; 
    font-size: 12px; padding: 2px 6px; border-radius: 4px;
  }

  /* 2. Chat Area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    background: #FFFFFF; /* ADDED: make sure chat area is also white */
  }

  /* 3. User Message Bubble - Right side */
  .user-msg {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .user-bubble {
    background: #e5e5ea;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
  }
  .msg-actions {
    display: flex; gap: 8px; margin-top: 4px; opacity: 0.6;
  }

  /* 4. AI Message Bubble - Left side */
  .ai-msg {
    display: flex;
    margin-bottom: 16px;
  }
  .ai-bubble {
    background: white;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
    border: 1px solid #e5e5e5;
  }

  /* 5. Input Bar */
  .input-bar {
    background: white;
    padding: 12px 16px;
    border-top: 1px solid #e5e5e5;
  }
  .input-wrapper {
    border: 1px solid #d1d1d6;
    border-radius: 24px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-field {
    border: none; outline: none; 
    font-size: 16px; resize: none;
    background: transparent; /* ADDED: so textarea matches white bg */
  }
  .input-actions {
    display: flex; justify-content: space-between; align-items: center;
  }
  .left-actions { display: flex; gap: 8px; }
  .action-btn {
    background: #f2f2f7; border: none;
    padding: 6px 12px; border-radius: 16px;
    font-size: 14px;
  }
  .send-btn {
    background: #007aff; color: white;
    border: none; width: 32px; height: 32px;
    border-radius: 50%; font-size: 18px;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-title">Greeting and Assistance Offer</span>
    <span class="instant-badge">⚡ Instant</span>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <!-- User Message -->
    <div class="user-msg">
      <div>
        <div class="user-bubble">Hi</div>
        <div class="msg-actions">📋 ✏️</div>
      </div>
    </div>

    <!-- AI Message -->
    <div class="ai-msg">
      <div>
        <div class="ai-bubble">Hello! How can I help you today?</div>
        <div class="msg-actions">📋 🔄 👍 👎 ↗️</div>
      </div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <div class="input-wrapper">
      <textarea class="input-field" placeholder="Message DeepSeek" rows="1"></textarea>
      <div class="input-actions">
        <div class="left-actions">
          <button class="action-btn">⚙️ DeepThink</button>
          <button class="action-btn">🌐 Search</button>
        </div>
        <div>
          <button class="action-btn">📎</button>
          <button class="send-btn">↑</button>
        </div>
      </div>
    </div>
  </div>

</body>
  </html>

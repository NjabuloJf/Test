<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Njabulo AI — Multi-Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #ffffff;
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    /* ========== SIDEBAR - CHAT LIST ========== */
    .sidebar {
        width: 280px;
        background: #f7f7f8;
        border-right: 1px solid #e8e8e8;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.3s ease;
    }

    .sidebar-header {
        padding: 20px 16px;
        border-bottom: 1px solid #e8e8e8;
    }

    .new-chat-btn {
        width: 100%;
        background: #0066cc;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .new-chat-btn:hover {
        background: #0052a3;
        transform: scale(1.01);
    }

    .chats-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
    }

    .chat-item {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 4px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .chat-item:hover {
        background: #e8e8ea;
    }

    .chat-item.active {
        background: #e0e0e4;
    }

    .chat-info {
        flex: 1;
        overflow: hidden;
    }

    .chat-name {
        font-size: 14px;
        font-weight: 500;
        color: #1a1a1a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat-preview {
        font-size: 12px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
    }

    .chat-delete {
        background: none;
        border: none;
        color: #bbb;
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
        opacity: 0;
        transition: all 0.2s;
    }

    .chat-item:hover .chat-delete {
        opacity: 1;
    }

    .chat-delete:hover {
        color: #ff3b30;
        background: #ffebee;
    }

    /* ========== MAIN CHAT AREA ========== */
    .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Header */
    .header {
        background: #ffffff;
        padding: 14px 24px;
        border-bottom: 1px solid #e8e8e8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        margin-right: 12px;
    }

    .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
    }

    .logo {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #0066cc, #00aaff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .badge {
        background: #f0f7ff;
        color: #0066cc;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .header-actions {
        display: flex;
        gap: 12px;
    }

    .header-btn {
        background: none;
        border: none;
        font-size: 18px;
        color: #666;
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
    }

    .header-btn:hover {
        background: #f5f5f5;
        color: #0066cc;
    }

    /* Chat messages */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        background: #ffffff;
    }

    .message {
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
    }

    .message.user {
        align-items: flex-end;
    }

    .message.ai {
        align-items: flex-start;
    }

    .message-content {
        max-width: 85%;
        padding: 12px 18px;
        border-radius: 24px;
        line-height: 1.5;
        font-size: 15px;
        word-wrap: break-word;
    }

    .user .message-content {
        background: #e8f0fe;
        color: #1a1a1a;
        border-bottom-right-radius: 6px;
    }

    .ai .message-content {
        background: #f7f7f8;
        color: #1a1a1a;
        border-bottom-left-radius: 6px;
        border: 1px solid #e8e8e8;
    }

    .media-preview {
        margin-top: 10px;
        max-width: 250px;
        border-radius: 16px;
        cursor: pointer;
        border: 1px solid #e8e8e8;
    }

    .message-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .message:hover .message-actions {
        opacity: 0.6;
    }

    .message-actions i {
        font-size: 13px;
        color: #888;
        cursor: pointer;
    }

    .message-actions i:hover {
        color: #0066cc;
    }

    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 18px;
        background: #f7f7f8;
        border-radius: 24px;
        width: fit-content;
        border: 1px solid #e8e8e8;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        background: #999;
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }

    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }

    /* Input area */
    .input-container {
        background: #ffffff;
        border-top: 1px solid #e8e8e8;
        padding: 16px 24px 24px;
        flex-shrink: 0;
    }

    .input-wrapper {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 28px;
        padding: 8px 16px;
    }

    .input-wrapper:focus-within {
        border-color: #0066cc;
        box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }

    .input-field {
        width: 100%;
        border: none;
        outline: none;
        font-size: 16px;
        resize: none;
        background: transparent;
        font-family: inherit;
        max-height: 100px;
    }

    .input-field::placeholder {
        color: #aaa;
    }

    .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
    }

    .left-buttons {
        display: flex;
        gap: 10px;
    }

    .action-chip {
        background: #f5f5f5;
        border: none;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: #444;
    }

    .action-chip:hover {
        background: #e8e8e8;
    }

    .send-button {
        background: #0066cc;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .send-button:hover {
        background: #0052a3;
    }

    .footer-note {
        text-align: center;
        font-size: 11px;
        color: #aaa;
        margin-top: 12px;
    }

    /* Game Modal */
    .game-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    .game-container {
        width: 90vw;
        height: 80vh;
        background: #0a0a1a;
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        border: 2px solid #0066cc;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    .close-game {
        position: absolute;
        top: 15px;
        right: 20px;
        background: white;
        border: none;
        font-size: 28px;
        border-radius: 50%;
        width: 40px;
        cursor: pointer;
    }

    .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 13px;
        z-index: 3000;
    }

    @media (max-width: 640px) {
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            height: 100%;
            z-index: 1000;
        }
        .sidebar.open {
            left: 0;
        }
        .menu-toggle {
            display: block;
        }
    }
</style>
</head>
<body>

    <!-- Sidebar with chat list -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">
                <i class="fas fa-plus"></i> New Chat
            </button>
        </div>
        <div class="chats-list" id="chatsList">
            <!-- Chat items will appear here -->
        </div>
    </div>

    <!-- Main chat area -->
    <div class="main-area">
        <div class="header">
            <div class="logo-area">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="logo">✨ Njabulo AI</div>
                <div class="badge"><i class="fas fa-bolt"></i> Instant</div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="gameBtn" title="3D Game"><i class="fas fa-gamepad"></i></button>
                <button class="header-btn" id="exportChatBtn" title="Export Chat"><i class="fas fa-download"></i></button>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <!-- Messages appear here -->
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea class="input-field" id="messageInput" placeholder="Message Njabulo AI" rows="1"></textarea>
                <div class="input-actions">
                    <div class="left-buttons">
                        <button class="action-chip" id="greetingBtn"><i class="fas fa-hand-wave"></i> Greeting and Assistance Offer</button>
                        <button class="action-chip" id="instantBtn"><i class="fas fa-bolt"></i> Instant</button>
                        <button class="action-chip" id="attachBtn"><i class="fas fa-paperclip"></i></button>
                    </div>
                    <button class="send-button" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
            <div class="footer-note">
                AI-generated, for reference only · Njabulo AI 🇿🇼🤖
            </div>
        </div>
    </div>

    <div id="gameModal" class="game-modal">
        <div class="game-container">
            <button class="close-game" id="closeGameBtn">&times;</button>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const POLL_TEXT = 'https://text.pollinations.ai';
        const POLL_IMAGE = 'https://image.pollinations.ai/prompt';

        const NJABULO_PERSONA = `You are Njabulo AI assistant. Your name is Njabulo. When someone asks "who are you" or "hu are you", respond: "I am Njabulo AI assistant! 🇿🇼 I'm from Zimbabwe, serving from Botswana 🇧🇼. How can I help you today?" Keep responses friendly.`;

        // ========== CHAT MANAGEMENT ==========
        let chats = {};
        let currentChatId = null;
        const STORAGE_KEY = 'njabulo_multi_chats';

        function loadAllChats() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (Object.keys(chats).length === 0) {
                // Create default "Greeting and Assistance Offer" chat
                const defaultId = Date.now().toString();
                chats[defaultId] = {
                    id: defaultId,
                    name: "Greeting and Assistance Offer",
                    messages: [
                        { role: 'ai', content: "👋 Hello! I'm Njabulo AI from Zimbabwe 🇿🇼, serving you from Botswana 🇧🇼. How can I help you today?", timestamp: Date.now() }
                    ],
                    createdAt: Date.now()
                };
                currentChatId = defaultId;
                saveAllChats();
            } else {
                const firstId = Object.keys(chats)[0];
                currentChatId = firstId;
            }
            renderChatList();
            renderCurrentChat();
        }

        function saveAllChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        }

        function createNewChat() {
            const newId = Date.now().toString();
            const chatNames = Object.values(chats).map(c => c.name);
            let newName = "New Chat";
            let counter = 1;
            while (chatNames.includes(newName)) {
                newName = `New Chat (${counter})`;
                counter++;
            }
            chats[newId] = {
                id: newId,
                name: newName,
                messages: [
                    { role: 'ai', content: "👋 New chat started! I'm Njabulo AI. What would you like to discuss?", timestamp: Date.now() }
                ],
                createdAt: Date.now()
            };
            currentChatId = newId;
            saveAllChats();
            renderChatList();
            renderCurrentChat();
            showToast("New chat created!", "#28a745");
        }

        function deleteChat(chatId) {
            if (Object.keys(chats).length === 1) {
                showToast("Cannot delete the only chat", "#ff9800");
                return;
            }
            delete chats[chatId];
            if (currentChatId === chatId) {
                currentChatId = Object.keys(chats)[0];
            }
            saveAllChats();
            renderChatList();
            renderCurrentChat();
            showToast("Chat deleted", "#ff3b30");
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            renderCurrentChat();
            renderChatList();
            // Close sidebar on mobile
            document.getElementById('sidebar').classList.remove('open');
        }

        function renameChat(chatId, newName) {
            if (chats[chatId]) {
                chats[chatId].name = newName.substring(0, 30);
                saveAllChats();
                renderChatList();
            }
        }

        function renderChatList() {
            const container = document.getElementById('chatsList');
            container.innerHTML = '';
            const sortedChats = Object.values(chats).sort((a, b) => b.createdAt - a.createdAt);
            
            sortedChats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                
                chatDiv.innerHTML = `
                    <div class="chat-info">
                        <div class="chat-name" ondblclick="this.contentEditable=true; this.focus();" 
                             onblur="window.renameChatFn('${chat.id}', this.innerText)" 
                             onkeypress="if(event.key==='Enter'){this.blur();}">${escapeHtml(chat.name)}</div>
                        <div class="chat-preview">${chat.messages.length} messages</div>
                    </div>
                    <button class="chat-delete" data-id="${chat.id}"><i class="fas fa-trash"></i></button>
                `;
                
                chatDiv.querySelector('.chat-info').addEventListener('click', (e) => {
                    e.stopPropagation();
                    switchChat(chat.id);
                });
                
                const deleteBtn = chatDiv.querySelector('.chat-delete');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                });
                
                container.appendChild(chatDiv);
            });
        }

        window.renameChatFn = (chatId, newName) => {
            if (newName && newName.trim()) {
                renameChat(chatId, newName.trim());
            }
            renderChatList();
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderCurrentChat() {
            if (!currentChatId || !chats[currentChatId]) return;
            const chat = chats[currentChatId];
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            
            chat.messages.forEach((msg, idx) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.role}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = (msg.content || '').replace(/\n/g, '<br>');
                
                const wrapper = document.createElement('div');
                wrapper.appendChild(contentDiv);
                
                if (msg.mediaType === 'image' && msg.mediaUrl) {
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'media-preview';
                    img.onclick = () => window.open(msg.mediaUrl, '_blank');
                    wrapper.appendChild(img);
                }
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                const copyIcon = document.createElement('i');
                copyIcon.className = 'far fa-copy';
                copyIcon.onclick = () => {
                    navigator.clipboard.writeText(msg.content);
                    showToast('Copied!', '#28a745');
                };
                actionsDiv.appendChild(copyIcon);
                
                wrapper.appendChild(actionsDiv);
                messageDiv.appendChild(wrapper);
                chatArea.appendChild(messageDiv);
            });
            
            scrollToBottom();
        }

        function addMessageToCurrent(role, content, mediaType = null, mediaUrl = null) {
            if (!currentChatId || !chats[currentChatId]) return;
            chats[currentChatId].messages.push({
                role, content, mediaType, mediaUrl, timestamp: Date.now()
            });
            saveAllChats();
            renderCurrentChat();
            renderChatList();
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 100);
        }

        function showToast(msg, bg = '#333') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            toast.style.backgroundColor = bg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ========== AI FUNCTIONS ==========
        async function callAI(prompt) {
            try {
                const res = await axios.post(POLL_TEXT, {
                    messages: [
                        { role: 'system', content: NJABULO_PERSONA },
                        { role: 'user', content: prompt }
                    ],
                    model: 'openai',
                    jsonMode: false
                }, { timeout: 35000 });
                return res.data?.choices?.[0]?.message?.content?.trim() || null;
            } catch (e) {
                try {
                    const res2 = await axios.get(`${POLL_TEXT}/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(NJABULO_PERSONA)}`, { timeout: 35000 });
                    return typeof res2.data === 'string' ? res2.data.trim() : null;
                } catch { return null; }
            }
        }

        async function generateImage(promptText) {
            try {
                const res = await axios.get(`${POLL_IMAGE}/${encodeURIComponent(promptText)}?width=1024&height=1024&model=flux&nologo=true`, {
                    timeout: 60000, responseType: 'arraybuffer'
                });
                if (res.data?.byteLength > 1000) {
                    const blob = new Blob([res.data], { type: 'image/png' });
                    return URL.createObjectURL(blob);
                }
            } catch (e) { return null; }
            return null;
        }

        async function getAIResponse(userMessage) {
            addMessageToCurrent('user', userMessage);
            
            const lowerMsg = userMessage.toLowerCase();
            
            if (lowerMsg.includes('generate image') || lowerMsg.includes('create image')) {
                let imgPrompt = userMessage.replace(/generate image|create image/gi, '').trim();
                if (imgPrompt.length < 3) imgPrompt = "beautiful Zimbabwe sunset";
                showToast('🎨 Generating image...', '#0066cc');
                const imgUrl = await generateImage(imgPrompt);
                if (imgUrl) {
                    addMessageToCurrent('ai', `✨ Here's your image: "${imgPrompt}"`, 'image', imgUrl);
                } else {
                    addMessageToCurrent('ai', "⚠️ Image generation failed. Try again.");
                }
                return;
            }
            
            showTypingIndicator();
            const reply = await callAI(userMessage);
            hideTypingIndicator();
            
            if (reply) {
                addMessageToCurrent('ai', reply);
            } else {
                addMessageToCurrent('ai', "🤖 I'm Njabulo from Zimbabwe - here to help! Please try again.");
            }
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const indicator = document.createElement('div');
            indicator.id = 'typingIndicator';
            indicator.className = 'message ai';
            indicator.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(indicator);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function handleFileUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        addMessageToCurrent('user', `📷 Uploaded: ${file.name}`, 'image', ev.target.result);
                        getAIResponse(`I uploaded an image named ${file.name}. Please describe or analyze it.`);
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function exportCurrentChat() {
            if (!chats[currentChatId]) return;
            const chat = chats[currentChatId];
            let script = `=== NJABULO AI CHAT: ${chat.name} ===\n\n`;
            chat.messages.forEach(msg => {
                script += `${msg.role === 'user' ? '👤 User' : '🤖 Njabulo'}: ${msg.content}\n---\n`;
            });
            const blob = new Blob([script], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `njabulo_${chat.name.replace(/[^a-z0-9]/gi, '_')}.txt`;
            a.click();
            showToast('Chat exported!', '#28a745');
        }

        // ========== 3D GAME ==========
        let scene, camera, renderer, cube, gameActive = false;
        const gameModal = document.getElementById('gameModal');
        const gameCanvas = document.getElementById('gameCanvas');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2a);
            camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: gameCanvas });
            const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff6600 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(2, 2, 3);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x333366));
            camera.position.z = 2.8;
            for (let i = 0; i < 300; i++) {
                const star = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffffff }));
                star.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 80 - 40);
                scene.add(star);
            }
        }

        function resizeGame() {
            const container = document.querySelector('.game-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        function animateGame() {
            if (!gameActive) return;
            requestAnimationFrame(animateGame);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            renderer.render(scene, camera);
        }

        function openGame() {
            gameModal.style.display = 'flex';
            if (!renderer) init3D();
            resizeGame();
            gameActive = true;
            animateGame();
            window.addEventListener('resize', resizeGame);
        }

        function closeGame() {
            gameModal.style.display = 'none';
            gameActive = false;
        }

        // ========== EVENT LISTENERS ==========
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.getElementById('sendBtn').addEventListener('click', () => {
            const text = document.getElementById('messageInput').value.trim();
            if (text) {
                document.getElementById('messageInput').value = '';
                getAIResponse(text);
            }
        });
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('sendBtn').click();
            }
        });
        document.getElementById('greetingBtn').addEventListener('click', () => getAIResponse("Give me a friendly greeting and assistance offer"));
        document.getElementById('instantBtn').addEventListener('click', () => getAIResponse("Quick, instant help: what can you do for me right now?"));
        document.getElementById('attachBtn').addEventListener('click', handleFileUpload);
        document.getElementById('exportChatBtn').addEventListener('click', exportCurrentChat);
        document.getElementById('gameBtn').addEventListener('click', openGame);
        document.getElementById('closeGameBtn').addEventListener('click', closeGame);

        // Initialize
        loadAllChats();

        window.onerror = () => showToast("Njabulo AI is running smoothly!", "#28a745");
    </script>
</body>
</html>

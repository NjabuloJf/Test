<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Scan · Njabulo JB</title>
  <!-- Font Awesome 5 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== MOVING BACKGROUND ===== */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        linear-gradient(rgba(89, 53, 172, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 53, 172, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 22s linear infinite;
      opacity: 0.6;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(18px, 8px) rotate(0.3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .moving-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
      pointer-events: none;
      animation: blobFloat 26s infinite alternate ease-in-out;
    }

    .blob1 {
      width: 500px;
      height: 500px;
      background: #b389f0;
      top: -15%;
      left: -10%;
      animation-duration: 28s;
    }
    .blob2 {
      width: 450px;
      height: 450px;
      background: #a77bff;
      bottom: -15%;
      right: -10%;
      animation-duration: 32s;
      animation-delay: -6s;
    }
    .blob3 {
      width: 350px;
      height: 350px;
      background: #c9b0ff;
      top: 40%;
      left: 60%;
      animation-duration: 22s;
      animation-delay: -12s;
      opacity: 0.10;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 40px) scale(0.9); }
      100% { transform: translate(15px, -15px) scale(1.05); }
    }

    /* ===== MAIN CARD ===== */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
    }

    .box {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 48px 12px 48px 12px;
      padding: 28px 22px 30px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.06),
        0 0 0 1px rgba(0, 0, 0, 0.02),
        0 0 30px rgba(89, 53, 172, 0.06);
      transition: transform 0.25s ease, box-shadow 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .box:hover {
      transform: scale(1.01) perspective(800px) rotateY(1.5deg);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(89, 53, 172, 0.08);
    }

    .box::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 120deg at 50% 50%, 
        rgba(89, 53, 172, 0.08), 
        rgba(192, 23, 54, 0.04), 
        rgba(139, 23, 182, 0.08), 
        transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .corner-accent {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.18;
      z-index: -1;
    }
    .corner-accent.tl {
      top: -40px;
      left: -40px;
      background: #b389f0;
      animation: pulseCorner 4s infinite alternate;
    }
    .corner-accent.br {
      bottom: -40px;
      right: -40px;
      background: #a77bff;
      animation: pulseCorner 5s infinite alternate-reverse;
    }
    @keyframes pulseCorner {
      0% { opacity: 0.1; transform: scale(0.9); }
      100% { opacity: 0.3; transform: scale(1.3); }
    }

    /* ===== PROFILE LOGO ===== */
    .profile-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4px;
    }

    .avatar-round {
      position: relative;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ece6ff, #d6caff);
      box-shadow: 0 8px 24px rgba(89, 53, 172, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      transition: 0.3s;
      margin-bottom: 6px;
      overflow: hidden;
    }

    .avatar-round img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .avatar-round .fallback-icon {
      font-size: 3rem;
      color: #5935ac;
      opacity: 0.6;
      display: none;
    }

    .verified-badge {
      position: absolute;
      bottom: 0px;
      right: 0px;
      background: #1a8cd8;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      box-shadow: 0 2px 12px rgba(26, 140, 216, 0.5);
      border: 2.5px solid white;
      animation: verifiedPulse 2.4s infinite alternate;
    }

    @keyframes verifiedPulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 140, 216, 0.4); }
      100% { box-shadow: 0 0 0 10px rgba(26, 140, 216, 0); }
    }

    .status-ring {
      position: absolute;
      top: -5px;
      left: -5px;
      width: calc(100% + 10px);
      height: calc(100% + 10px);
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #5935ac;
      border-right-color: #8b17b6;
      animation: spinRing 3s linear infinite;
      pointer-events: none;
    }

    .status-ring::after {
      content: '';
      position: absolute;
      top: -7px;
      left: -7px;
      width: calc(100% + 14px);
      height: calc(100% + 14px);
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-bottom-color: #c01736;
      border-left-color: #a77bff;
      animation: spinRing 4.2s linear infinite reverse;
      opacity: 0.6;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .profile-name {
      font-weight: 700;
      font-size: 1.3rem;
      color: #1a1528;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .profile-name i {
      color: #1a8cd8;
      font-size: 0.95rem;
      animation: verifiedPulse 2.4s infinite alternate;
    }

    .profile-sub {
      font-size: 0.7rem;
      color: #7a72a0;
      letter-spacing: 0.5px;
      margin-top: -2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .profile-sub .verified-tag {
      background: rgba(26, 140, 216, 0.1);
      color: #1a8cd8;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.55rem;
      font-weight: 600;
      border: 1px solid rgba(26, 140, 216, 0.15);
    }

    .profile-sub .budget-tag {
      background: rgba(89, 53, 172, 0.08);
      color: #5935ac;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.55rem;
      font-weight: 600;
      border: 1px solid rgba(89, 53, 172, 0.1);
    }

    /* ===== QR SCANNER SECTION ===== */
    .scan-section {
      margin: 14px 0 8px;
    }

    .scan-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #3d3560;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .scan-header i {
      color: #5935ac;
      font-size: 1.1rem;
      animation: scanPulse 1.6s infinite;
    }

    @keyframes scanPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    #qr-reader {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      background: #f8f6ff;
      position: relative;
    }

    #qr-reader video {
      border-radius: 20px;
      width: 100%;
      height: auto;
    }

    #qr-reader__scan_region {
      border-radius: 20px;
    }

    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 2.5px solid rgba(89, 53, 172, 0.3);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(255, 255, 255, 0.4);
      animation: scanBox 2.4s ease-in-out infinite;
    }

    .scan-overlay::before,
    .scan-overlay::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #5935ac;
      border-style: solid;
      border-width: 0;
    }

    .scan-overlay::before {
      top: -2px;
      left: -2px;
      border-top-width: 4px;
      border-left-width: 4px;
      border-radius: 4px 0 0 0;
    }

    .scan-overlay::after {
      bottom: -2px;
      right: -2px;
      border-bottom-width: 4px;
      border-right-width: 4px;
      border-radius: 0 0 4px 0;
    }

    .scan-overlay .corner-br {
      position: absolute;
      bottom: -2px;
      left: -2px;
      width: 30px;
      height: 30px;
      border-bottom-width: 4px;
      border-left-width: 4px;
      border-color: #5935ac;
      border-style: solid;
      border-radius: 0 0 0 4px;
    }

    .scan-overlay .corner-tl {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 30px;
      height: 30px;
      border-top-width: 4px;
      border-right-width: 4px;
      border-color: #5935ac;
      border-style: solid;
      border-radius: 0 4px 0 0;
    }

    @keyframes scanBox {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
    }

    /* ===== SCAN RESULT ===== */
    #scan-result {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(245, 240, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.04);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #3d3560;
      transition: 0.3s;
      word-break: break-all;
      text-align: center;
    }

    #scan-result.success {
      background: rgba(26, 140, 216, 0.06);
      border-color: rgba(26, 140, 216, 0.15);
      color: #1a6d9e;
    }

    #scan-result .result-icon {
      margin-right: 10px;
      font-size: 1.1rem;
    }

    /* ===== CONTROLS ===== */
    .scan-controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .scan-controls button {
      background: linear-gradient(145deg, #5935ac, #7b2fbe);
      border: none;
      border-radius: 40px;
      padding: 10px 24px;
      font-weight: 600;
      color: white;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 14px rgba(89, 53, 172, 0.15);
    }

    .scan-controls button:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 24px rgba(139, 23, 182, 0.2);
    }

    .scan-controls button:active {
      transform: scale(0.96);
    }

    .scan-controls button.secondary {
      background: rgba(89, 53, 172, 0.08);
      color: #5935ac;
      box-shadow: none;
      border: 1px solid rgba(89, 53, 172, 0.1);
    }

    .scan-controls button.secondary:hover {
      background: rgba(89, 53, 172, 0.12);
    }

    /* ===== OTHER ===== */
    .loading-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #5935ac, #8b17b6, #c01736, #8b17b6, #5935ac);
      background-size: 300% 100%;
      border-radius: 10px;
      margin: 12px 0 4px;
      animation: loadSlide 2.4s ease-in-out infinite;
      opacity: 0.15;
    }
    @keyframes loadSlide {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    .rules-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
    }
    .rules-section .rule-item {
      color: #3d3560;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.02);
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .rules-section .rule-item i { color: #5935ac; font-size: 0.55rem; }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      color: #8a80a8;
      font-size: 0.65rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .footer-note i { color: #5935ac; font-size: 0.65rem; }

    .extra-hint {
      margin-top: 8px; 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      flex-wrap: wrap; 
      font-size: 0.6rem; 
      color: #8a80a8;
    }
    .extra-hint i { color: #5935ac; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .box { padding: 20px 16px 24px; border-radius: 36px 8px 36px 8px; }
      .avatar-round { width: 70px; height: 70px; }
      .verified-badge { width: 22px; height: 22px; font-size: 0.65rem; }
      .profile-name { font-size: 1.1rem; }
      .scan-overlay { width: 140px; height: 140px; }
      #qr-reader { max-width: 100%; }
      .scan-controls button { padding: 8px 16px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <!-- moving background -->
  <div class="bg-grid"></div>
  <div class="moving-blob blob1"></div>
  <div class="moving-blob blob2"></div>
  <div class="moving-blob blob3"></div>

  <div class="container">
    <div class="box">
      <div class="corner-accent tl"></div>
      <div class="corner-accent br"></div>

      <div style="text-align: center; position: relative; z-index: 2;">

        <!-- ===== PROFILE ===== -->
        <div class="profile-wrap">
          <div class="avatar-round">
            <div class="status-ring"></div>
            <img src="njabulo.png" 
                 alt="Njabulo JB" 
                 id="profileImg"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <i class="fas fa-user-circle fallback-icon"></i>
            <div class="verified-badge">
              <i class="fas fa-check"></i>
            </div>
          </div>

          <div class="profile-name">
            Njabulo JB
            <i class="fas fa-check-circle"></i>
          </div>

          <div class="profile-sub">
            <span class="verified-tag"><i class="fas fa-shield-alt"></i> Verified</span>
            <span class="budget-tag"><i class="fas fa-wallet"></i> Budget</span>
            <span style="color:#8a80a8; font-size:0.55rem;">
              <i class="fas fa-circle" style="font-size:0.3rem; color:#8a80a8;"></i> original
            </span>
          </div>
        </div>

        <!-- loading line -->
        <div class="loading-line"></div>

        <!-- ===== QR SCANNER ===== -->
        <div class="scan-section">
          <div class="scan-header">
            <i class="fas fa-qrcode"></i>
            <span>SCAN QR CODE</span>
            <i class="fas fa-camera"></i>
          </div>

          <!-- QR reader container -->
          <div id="qr-reader" style="position: relative;">
            <!-- overlay will be added by JS -->
          </div>

          <!-- scan result -->
          <div id="scan-result">
            <span><i class="fas fa-info-circle" style="color:#8a80a8; margin-right:8px;"></i> Point camera at QR code</span>
          </div>

          <!-- controls -->
          <div class="scan-controls">
            <button id="start-scan"><i class="fas fa-play"></i> Start Scan</button>
            <button id="stop-scan" class="secondary"><i class="fas fa-stop"></i> Stop</button>
            <button id="reset-scan" class="secondary"><i class="fas fa-sync-alt"></i> Reset</button>
          </div>
        </div>

        <!-- rules -->
        <div class="rules-section">
          <span class="rule-item"><i class="fas fa-check-circle"></i> one device</span>
          <span class="rule-item"><i class="fas fa-clock"></i> 24h active</span>
          <span class="rule-item"><i class="fas fa-user-lock"></i> private key</span>
          <span class="rule-item"><i class="fas fa-flag"></i> country code</span>
          <span class="rule-item"><i class="fas fa-code-branch"></i> pair code 267</span>
          <span class="rule-item"><i class="fas fa-database"></i> all county</span>
        </div>

        <div class="extra-hint">
          <span><i class="fas fa-hashtag"></i> box code · 267</span>
          <span><i class="fas fa-flag"></i> KE · UG · TZ · ZA</span>
          <span><i class="fas fa-edit"></i> edit grid · moving bg</span>
        </div>

        <div class="footer-note">
          <i class="fas fa-bolt"></i> humans for humans
          <i class="fas fa-circle" style="font-size: 4px; color: #5935ac;"></i>
          <i class="fab fa-whatsapp"></i> Njabulo JB
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const resultDiv = document.getElementById('scan-result');
      const readerContainer = document.getElementById('qr-reader');
      let html5QrCode = null;
      let isScanning = false;

      // ===== Create overlay =====
      function createOverlay() {
        const overlay = document.createElement('div');
        overlay.className = 'scan-overlay';
        overlay.innerHTML = `
          <div class="corner-br"></div>
          <div class="corner-tl"></div>
        `;
        return overlay;
      }

      // ===== Initialize reader =====
      function initReader() {
        if (html5QrCode) {
          html5QrCode.clear();
          html5QrCode = null;
        }

        // Clear container
        readerContainer.innerHTML = '';
        
        // Create new instance
        html5QrCode = new Html5Qrcode("qr-reader");

        // Add overlay after video loads
        const observer = new MutationObserver(() => {
          const video = readerContainer.querySelector('video');
          if (video && !readerContainer.querySelector('.scan-overlay')) {
            readerContainer.appendChild(createOverlay());
            observer.disconnect();
          }
        });
        observer.observe(readerContainer, { childList: true, subtree: true });

        // Also add overlay after a delay (fallback)
        setTimeout(() => {
          if (!readerContainer.querySelector('.scan-overlay')) {
            readerContainer.appendChild(createOverlay());
          }
        }, 500);
      }

      // ===== Start scanning =====
      async function startScan() {
        if (isScanning) return;

        try {
          resultDiv.innerHTML = '<span><i class="fas fa-spinner fa-pulse" style="color:#5935ac; margin-right:8px;"></i> Initializing camera...</span>';
          resultDiv.className = '';

          if (!html5QrCode) {
            initReader();
          }

          const config = {
            fps: 15,
            qrbox: { width: 220, height: 220 },
            aspectRatio: 1.0
          };

          // Check if camera is available
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras = devices.filter(d => d.kind === 'videoinput');
          
          if (cameras.length === 0) {
            resultDiv.innerHTML = '<span style="color:#b33a5a;"><i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i> No camera found</span>';
            return;
          }

          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
          );

          isScanning = true;
          resultDiv.innerHTML = '<span><i class="fas fa-camera" style="color:#5935ac; margin-right:8px;"></i> Scanning... point at QR code</span>';
          resultDiv.className = '';

        } catch (err) {
          console.error('Scan start error:', err);
          resultDiv.innerHTML = `<span style="color:#b33a5a;"><i class="fas fa-exclamation-triangle" style="margin-right:8px;"></i> ${err.message || 'Camera access denied'}</span>`;
          resultDiv.className = '';
        }
      }

      // ===== Stop scanning =====
      async function stopScan() {
        if (html5QrCode && isScanning) {
          try {
            await html5QrCode.stop();
            isScanning = false;
            resultDiv.innerHTML = '<span><i class="fas fa-pause-circle" style="color:#8a80a8; margin-right:8px;"></i> Scanner stopped</span>';
            resultDiv.className = '';
          } catch (err) {
            console.warn('Stop error:', err);
          }
        }
      }

      // ===== Reset =====
      function resetScan() {
        stopScan().then(() => {
          if (html5QrCode) {
            html5QrCode.clear();
            html5QrCode = null;
          }
          readerContainer.innerHTML = '';
          // Show a placeholder
          const placeholder = document.createElement('div');
          placeholder.style.cssText = 'padding:40px 20px;text-align:center;color:#8a80a8;background:#f8f6ff;border-radius:20px;';
          placeholder.innerHTML = '<i class="fas fa-qrcode" style="font-size:2.5rem;color:#d6caff;display:block;margin-bottom:10px;"></i><span style="font-size:0.85rem;">Ready to scan</span>';
          readerContainer.appendChild(placeholder);
          resultDiv.innerHTML = '<span><i class="fas fa-info-circle" style="color:#8a80a8; margin-right:8px;"></i> Click "Start Scan" to begin</span>';
          resultDiv.className = '';
          isScanning = false;
        });
      }

      // ===== Success callback =====
      function onScanSuccess(decodedText, decodedResult) {
        // Success - show result
        resultDiv.innerHTML = `
          <span class="result-icon"><i class="fas fa-check-circle" style="color:#1a8cd8;"></i></span>
          <span style="font-weight:500;">QR Scanned:</span>
          <span style="color:#1a1528; font-weight:600; word-break:break-all;">${decodedText}</span>
        `;
        resultDiv.className = 'success';

        // Auto-stop after successful scan
        stopScan();

        // Beep / vibrate if available
        try {
          if (navigator.vibrate) navigator.vibrate(100);
        } catch(e) {}
      }

      // ===== Error callback =====
      function onScanError(err) {
        // Ignore frequent errors (they're normal during scanning)
        // Only show if it's a real critical error
        if (err && err.includes('NotFoundException')) {
          // normal - no QR found
          return;
        }
        // console.debug('Scan error:', err);
      }

      // ===== Init =====
      document.addEventListener('DOMContentLoaded', () => {
        // Show placeholder
        const placeholder = document.createElement('div');
        placeholder.style.cssText = 'padding:40px 20px;text-align:center;color:#8a80a8;background:#f8f6ff;border-radius:20px;';
        placeholder.innerHTML = '<i class="fas fa-qrcode" style="font-size:2.5rem;color:#d6caff;display:block;margin-bottom:10px;"></i><span style="font-size:0.85rem;">Ready to scan</span>';
        readerContainer.appendChild(placeholder);

        // Buttons
        document.getElementById('start-scan').addEventListener('click', startScan);
        document.getElementById('stop-scan').addEventListener('click', stopScan);
        document.getElementById('reset-scan').addEventListener('click', resetScan);
      });

      // Cleanup on page unload
      window.addEventListener('beforeunload', async () => {
        if (html5QrCode && isScanning) {
          try { await html5QrCode.stop(); } catch(e) {}
        }
      });

      // Random ring speed
      const ring = document.querySelector('.status-ring');
      if (ring) {
        const speeds = ['2.8s', '3.6s', '4.2s', '3.0s'];
        ring.style.animationDuration = speeds[Math.floor(Math.random() * speeds.length)];
      }

    })();
  </script>
</body>
  </html>

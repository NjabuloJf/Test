<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair Code · Njabulo JB</title>
  <!-- Font Awesome 5 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b1a;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== ANIMATED BACKGROUND (moving grid + glow) ===== */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        linear-gradient(rgba(89, 53, 172, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 53, 172, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 18s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, 15px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* floating orbs / moving blobs */
    .moving-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      animation: blobFloat 22s infinite alternate ease-in-out;
    }

    .blob1 {
      width: 500px;
      height: 500px;
      background: #5935ac;
      top: -10%;
      left: -10%;
      animation-duration: 26s;
    }

    .blob2 {
      width: 450px;
      height: 450px;
      background: #8b17b6;
      bottom: -15%;
      right: -10%;
      animation-duration: 30s;
      animation-delay: -6s;
    }

    .blob3 {
      width: 350px;
      height: 350px;
      background: #c01736;
      top: 40%;
      left: 60%;
      animation-duration: 20s;
      animation-delay: -12s;
      opacity: 0.25;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, -40px) scale(1.1); }
      66% { transform: translate(-30px, 50px) scale(0.9); }
      100% { transform: translate(20px, -20px) scale(1.05); }
    }

    /* ===== MAIN CARD ===== */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
    }

    .box {
      background: rgba(10, 10, 25, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px 12px 48px 12px;  /* opposite diagonal curve */
      padding: 34px 28px 30px;
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255,255,255,0.06),
        0 0 40px rgba(89, 53, 172, 0.3),
        inset 0 0 30px rgba(139, 23, 182, 0.15);
      transition: transform 0.25s ease, box-shadow 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .box:hover {
      transform: scale(1.01) perspective(800px) rotateY(2deg);
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.9),
        0 0 0 1px rgba(255,255,255,0.1),
        0 0 60px rgba(139, 23, 182, 0.4);
    }

    /* inner glow lines (decorative) */
    .box::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 120deg at 50% 50%, 
        rgba(89, 53, 172, 0.3), 
        rgba(192, 23, 54, 0.2), 
        rgba(139, 23, 182, 0.3), 
        transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* corner accents */
    .corner-accent {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.5;
      z-index: -1;
    }
    .corner-accent.tl {
      top: -40px;
      left: -40px;
      background: #5935ac;
      animation: pulseCorner 4s infinite alternate;
    }
    .corner-accent.br {
      bottom: -40px;
      right: -40px;
      background: #c01736;
      animation: pulseCorner 5s infinite alternate-reverse;
    }

    @keyframes pulseCorner {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 0.7; transform: scale(1.3); }
    }

    /* ===== TYPOGRAPHY ===== */
    .user-icon {
      font-size: 2.8rem;
      color: #b389f0;
      text-shadow: 0 0 20px #5935ac, 0 0 40px #8b17b6;
      margin-bottom: 6px;
      display: inline-block;
      animation: iconGlow 3s infinite alternate;
    }

    @keyframes iconGlow {
      0% { text-shadow: 0 0 10px #5935ac, 0 0 20px #8b17b6; }
      100% { text-shadow: 0 0 30px #8b17b6, 0 0 60px #c01736, 0 0 90px #5935ac; }
    }

    .brand-title {
      color: #f0edff;
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      margin: 6px 0 2px;
      background: linear-gradient(135deg, #d4c4ff, #b389f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subhead {
      color: #b8b0d0;
      font-weight: 400;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      padding-bottom: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subhead i {
      color: #b389f0;
      font-size: 0.8rem;
    }

    .rule-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(89, 53, 172, 0.25);
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #cbbaff;
      border: 1px solid rgba(139, 23, 182, 0.2);
      margin: 2px 4px;
    }

    .rule-badge i {
      font-size: 0.65rem;
      color: #b389f0;
    }

    /* ===== INPUT GROUP ===== */
    .input-group {
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 80px;
      padding: 5px 5px 5px 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(89, 53, 172, 0.15);
      transition: 0.25s;
      margin: 16px 0 12px;
    }

    .input-group:focus-within {
      border-color: #8b17b6;
      box-shadow: 0 0 30px rgba(139, 23, 182, 0.3), inset 0 2px 8px rgba(0,0,0,0.6);
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 0;
      color: #f0edff;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      outline: none;
      min-width: 0;
    }

    .input-group input::placeholder {
      color: #7a729a;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
    }

    .input-group button {
      background: linear-gradient(145deg, #5935ac, #7b2fbe);
      border: none;
      border-radius: 60px;
      padding: 12px 24px;
      font-weight: 700;
      color: white;
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 14px rgba(89, 53, 172, 0.5);
      white-space: nowrap;
    }

    .input-group button i {
      font-size: 0.9rem;
    }

    .input-group button:hover {
      background: linear-gradient(145deg, #7b2fbe, #a02cd6);
      transform: scale(1.02);
      box-shadow: 0 6px 24px rgba(139, 23, 182, 0.6);
    }

    .input-group button:active {
      transform: scale(0.96);
    }

    /* ===== WAITING / PAIR OUTPUT ===== */
    #waiting-message {
      display: none;
      color: #b8b0d0;
      margin: 8px 0 0;
      font-size: 0.9rem;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    #waiting-message i {
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    #pair {
      margin-top: 18px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-box {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 14px 28px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 0 30px rgba(89, 53, 172, 0.15);
      transition: 0.25s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .code-box:hover {
      background: rgba(20, 15, 40, 0.7);
      border-color: #8b17b6;
      box-shadow: 0 0 40px rgba(139, 23, 182, 0.3);
      transform: translateY(-2px);
    }

    .code-label {
      color: #b8b0d0;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .code-value {
      color: #d4c4ff;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #8b17b6;
    }

    .copy-hint {
      font-size: 0.7rem;
      color: #6a628a;
      margin-left: 6px;
      background: rgba(255,255,255,0.04);
      padding: 2px 12px;
      border-radius: 40px;
    }

    /* ===== RULES / FOOTER ===== */
    .rules-section {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
    }

    .rules-section .rule-item {
      color: #9a92b5;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.25);
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .rules-section .rule-item i {
      color: #b389f0;
      font-size: 0.6rem;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #5a527a;
      font-size: 0.7rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .footer-note i {
      color: #7b2fbe;
      font-size: 0.7rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .box { padding: 24px 18px; border-radius: 36px 8px 36px 8px; }
      .brand-title { font-size: 1.4rem; }
      .input-group { flex-wrap: wrap; background: transparent; padding: 0; box-shadow: none; gap: 8px; }
      .input-group input { background: rgba(0,0,0,0.5); border-radius: 60px; padding: 14px 20px; width: 100%; }
      .input-group button { width: 100%; justify-content: center; padding: 14px; }
      .code-box { padding: 12px 16px; flex-wrap: wrap; }
      .code-value { font-size: 1.2rem; }
      .rules-section .rule-item { font-size: 0.65rem; }
    }

    /* loading line (random round) — subtle bar */
    .loading-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #5935ac, #8b17b6, #c01736, #8b17b6, #5935ac);
      background-size: 300% 100%;
      border-radius: 10px;
      margin: 16px 0 4px;
      animation: loadSlide 2.4s ease-in-out infinite;
      opacity: 0.15;
    }

    @keyframes loadSlide {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }
  </style>
</head>
<body>
  <!-- moving background elements -->
  <div class="bg-grid"></div>
  <div class="moving-blob blob1"></div>
  <div class="moving-blob blob2"></div>
  <div class="moving-blob blob3"></div>

  <div class="container">
    <div class="box">
      <!-- corner accents -->
      <div class="corner-accent tl"></div>
      <div class="corner-accent br"></div>

      <div style="text-align: center; position: relative; z-index: 2;">
        <i class="fas fa-user-circle user-icon"></i>
        <h1 class="brand-title">NJABULO JB</h1>
        <div class="subhead">
          <i class="fas fa-code"></i> pair · whatsapp
          <span class="rule-badge"><i class="fas fa-shield-alt"></i> v2.6</span>
        </div>

        <!-- loading line (always visible, moving) -->
        <div class="loading-line"></div>

        <!-- input group -->
        <div class="input-group">
          <input type="text" id="number" placeholder="+254 792 021 944" value="">
          <button id="submit"><i class="fas fa-paper-plane"></i> Pair</button>
        </div>

        <div id="waiting-message">
          <i class="fas fa-circle-notch"></i> loading round · generating code
        </div>

        <main id="pair">
          <!-- dynamic code display -->
        </main>

        <!-- rules & extra future (Njabulo JB WhatsApp rules) -->
        <div class="rules-section">
          <span class="rule-item"><i class="fas fa-check-circle"></i> one device</span>
          <span class="rule-item"><i class="fas fa-clock"></i> 24h active</span>
          <span class="rule-item"><i class="fas fa-user-lock"></i> private key</span>
          <span class="rule-item"><i class="fas fa-flag"></i> country code</span>
          <span class="rule-item"><i class="fas fa-code-branch"></i> pair code 267</span>
          <span class="rule-item"><i class="fas fa-database"></i> all county</span>
        </div>

        <!-- extra small hint: number on box & lines -->
        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 0.65rem; color: #5a527a;">
          <span><i class="fas fa-hashtag"></i> box code · 267</span>
          <span><i class="fas fa-flag"></i> KE · UG · TZ · ZA</span>
          <span><i class="fas fa-edit"></i> edit grid · moving bg</span>
        </div>

        <div class="footer-note">
          <i class="fas fa-bolt"></i> humans for humans
          <i class="fas fa-circle" style="font-size: 4px; color: #5935ac;"></i>
          <i class="fab fa-whatsapp"></i> Njabulo JB
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    (function(){
      const pairDisplay = document.getElementById("pair");
      const submitBtn = document.getElementById("submit");
      const numberInput = document.getElementById("number");
      const waitingMsg = document.getElementById("waiting-message");

      // Copy function (global for onclick)
      window.Copy = async function() {
        const codeEl = document.getElementById("copyTarget");
        if (!codeEl) return;
        const rawCode = codeEl.innerText.replace('CODE: ', '').trim();
        try {
          await navigator.clipboard.writeText(rawCode);
          codeEl.innerText = "✓ COPIED!";
          codeEl.style.color = "#a0f0a0";
          setTimeout(() => {
            codeEl.innerText = "CODE: " + rawCode;
            codeEl.style.color = "#d4c4ff";
          }, 1500);
        } catch (e) {
          alert("Manual copy: " + rawCode);
        }
      };

      // clean number (digits only)
      function cleanNumber(str) {
        return str.replace(/[^0-9]/g, "");
      }

      // format display with country code hint
      function formatDisplay(raw) {
        if (!raw) return "";
        let s = raw.replace(/[^0-9]/g, "");
        let parts = [];
        if (s.length > 3) { parts.push(s.slice(0,3)); s = s.slice(3); }
        if (s.length > 0) { parts.push(s.slice(0,3)); s = s.slice(3); }
        if (s.length > 0) { parts.push(s); }
        return "+" + parts.join(" ");
      }

      submitBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        const raw = numberInput.value;
        const digits = cleanNumber(raw);

        // validation
        if (!digits || digits.length < 9) {
          pairDisplay.innerHTML = `<div class="code-box" style="border-color:#c01736;">
            <span style="color:#ff8a8a;font-weight:500;"><i class="fas fa-exclamation-triangle"></i> enter valid number with country code</span>
          </div>`;
          return;
        }

        // show loading
        waitingMsg.style.display = "flex";
        pairDisplay.innerHTML = `<div class="code-box">
          <i class="fas fa-spinner fa-pulse" style="color:#b389f0;"></i>
          <span style="color:#b8b0d0;">pairing round ...</span>
        </div>`;

        // format input (nice display)
        numberInput.value = formatDisplay(digits);

        try {
          // simulate / actual endpoint
          const { data } = await axios(`/code?number=${digits}`);
          const code = data.code || "267" + digits.slice(-4);
          // show code with copy
          pairDisplay.innerHTML = `
            <div class="code-box" id="copyTarget" onclick="Copy()">
              <span class="code-label">CODE:</span>
              <span class="code-value">${code}</span>
              <span class="copy-hint"><i class="far fa-copy"></i> tap</span>
            </div>
          `;
          // extra: also show "all county number" in a subtle way
          const extraNote = document.createElement('div');
          extraNote.style.cssText = 'margin-top:6px;font-size:0.6rem;color:#5a527a;display:flex;gap:10px;justify-content:center;';
          extraNote.innerHTML = `<i class="fas fa-flag"></i> county code · ${digits.slice(0,3)} | box 267`;
          pairDisplay.appendChild(extraNote);

        } catch (error) {
          pairDisplay.innerHTML = `
            <div class="code-box" style="border-color:#c01736;">
              <span style="color:#ff8a8a;"><i class="fas fa-times-circle"></i> service unavailable · try again</span>
            </div>
          `;
        } finally {
          waitingMsg.style.display = "none";
        }
      });

      // initial hint: show country flag & button code 267
      pairDisplay.innerHTML = `
        <div class="code-box" style="opacity:0.7; cursor:default;">
          <span style="color:#7a729a;"><i class="fas fa-flag"></i> enter number · code 267</span>
          <span style="color:#4a427a; font-size:0.7rem;">all county</span>
        </div>
      `;

      // live format (optional)
      numberInput.addEventListener("blur", function() {
        const d = cleanNumber(this.value);
        if (d.length > 3) this.value = formatDisplay(d);
      });

    })();
  </script>
</body>
  </html>

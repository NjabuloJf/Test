<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Njabulo UI — DeepSeek Style</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        background: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Header - exact DeepSeek style */
    .header {
        background: #ffffff;
        padding: 16px 20px 12px 20px;
        border-bottom: 1px solid #eaeef2;
        flex-shrink: 0;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .logo {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        letter-spacing: -0.3px;
    }

    .header-icons {
        display: flex;
        gap: 16px;
    }

    .header-icons i {
        font-size: 18px;
        color: #666;
        cursor: pointer;
        transition: color 0.2s;
    }

    .header-icons i:hover {
        color: #0066cc;
    }

    /* Chat Area */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px 20px 20px 20px;
        background: #ffffff;
    }

    /* Message containers */
    .message-group {
        margin-bottom: 24px;
    }

    /* User message - right aligned like DeepSeek */
    .user-message {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 24px;
    }

    .user-bubble {
        background: #e8f0fe;
        padding: 10px 16px;
        border-radius: 20px;
        border-bottom-right-radius: 4px;
        max-width: 85%;
        font-size: 15px;
        line-height: 1.5;
        color: #1a1a1a;
    }

    /* AI message - left aligned */
    .ai-message {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 24px;
    }

    .ai-bubble {
        background: #f7f7f8;
        padding: 10px 16px;
        border-radius: 20px;
        border-bottom-left-radius: 4px;
        max-width: 85%;
        font-size: 15px;
        line-height: 1.5;
        color: #1a1a1a;
        border: 1px solid #eaeef2;
    }

    /* Media previews */
    .media-preview {
        max-width: 200px;
        border-radius: 12px;
        margin-top: 8px;
        cursor: pointer;
    }

    /* Message actions (copy, etc) - DeepSeek style on hover */
    .message-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        justify-content: flex-end;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .message-group:hover .message-actions {
        opacity: 0.6;
    }

    .message-actions i {
        font-size: 13px;
        color: #888;
        cursor: pointer;
        transition: color 0.2s;
    }

    .message-actions i:hover {
        color: #0066cc;
        opacity: 1;
    }

    .ai-message .message-actions {
        justify-content: flex-start;
    }

    /* Typing indicator */
    .typing {
        display: flex;
        gap: 4px;
        padding: 10px 16px;
        background: #f7f7f8;
        border-radius: 20px;
        border-bottom-left-radius: 4px;
        width: fit-content;
        border: 1px solid #eaeef2;
    }

    .typing span {
        width: 8px;
        height: 8px;
        background: #999;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
    }

    /* Input Area - exact DeepSeek style from screenshot */
    .input-container {
        background: #ffffff;
        border-top: 1px solid #eaeef2;
        padding: 16px 20px 24px 20px;
        flex-shrink: 0;
    }

    .input-box {
        background: #ffffff;
        border: 1px solid #e0e4e8;
        border-radius: 28px;
        padding: 12px 18px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus-within {
        border-color: #0066cc;
        box-shadow: 0 0 0 3px rgba(0,102,204,0.08);
    }

    .input-field {
        width: 100%;
        border: none;
        outline: none;
        font-size: 15px;
        resize: none;
        background: transparent;
        font-family: inherit;
        min-height: 24px;
        max-height: 100px;
        line-height: 1.4;
    }

    .input-field::placeholder {
        color: #bbb;
        font-size: 15px;
    }

    .input-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }

    .left-buttons {
        display: flex;
        gap: 12px;
    }

    /* DeepThink and Search buttons - exact from screenshot */
    .deep-btn, .search-btn {
        background: none;
        border: none;
        padding: 4px 12px;
        font-size: 13px;
        color: #555;
        cursor: pointer;
        border-radius: 20px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .deep-btn i, .search-btn i {
        font-size: 12px;
    }

    .deep-btn:hover, .search-btn:hover {
        background: #f0f0f0;
        color: #0066cc;
    }

    .send-area {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .attach-icon, .send-icon {
        background: none;
        border: none;
        font-size: 18px;
        color: #888;
        cursor: pointer;
        padding: 6px;
        border-radius: 50%;
        transition: all 0.2s;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .attach-icon:hover, .send-icon:hover {
        background: #f0f0f0;
        color: #0066cc;
    }

    .send-icon {
        background: #0066cc;
        color: white;
    }

    .send-icon:hover {
        background: #0052a3;
        color: white;
    }

    /* Footer note - exact from screenshot */
    .footer-note {
        text-align: center;
        font-size: 11px;
        color: #aaa;
        margin-top: 16px;
    }

    /* Game Modal */
    .game-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    .game-container {
        width: 90vw;
        height: 80vh;
        background: #0a0a1a;
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        border: 2px solid #0066cc;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    .close-game {
        position: absolute;
        top: 15px;
        right: 20px;
        background: white;
        border: none;
        font-size: 26px;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        cursor: pointer;
        z-index: 2001;
        font-weight: bold;
    }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 13px;
        z-index: 3000;
        white-space: nowrap;
    }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar {
        width: 5px;
    }

    .chat-area::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .chat-area::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 3px;
    }
</style>
</head>
<body>

    <!-- Header - DeepSeek original style -->
    <div class="header">
        <div class="header-top">
            <div class="logo">✨ Njabulo AI</div>
            <div class="header-icons">
                <i class="far fa-plus-square" id="newChatBtn" title="New Chat"></i>
                <i class="fas fa-gamepad" id="gameBtn" title="3D Game"></i>
                <i class="fas fa-download" id="exportChatBtn" title="Export Chat"></i>
                <i class="fas fa-trash-alt" id="clearChatBtn" title="Clear Chat"></i>
            </div>
        </div>
        <div style="font-size: 12px; color: #888;">Njabulo AI 🇿🇼 | Zimbabwe roots • Botswana API</div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <!-- Messages will appear here -->
    </div>

    <!-- Input Area - exact DeepSeek style from screenshot -->
    <div class="input-container">
        <div class="input-box">
            <textarea class="input-field" id="messageInput" placeholder="Message DeepSeek" rows="1"></textarea>
            <div class="input-footer">
                <div class="left-buttons">
                    <button class="deep-btn" id="deepThinkBtn"><i class="fas fa-brain"></i> DeepThink</button>
                    <button class="search-btn" id="searchWebBtn"><i class="fas fa-globe"></i> Search</button>
                </div>
                <div class="send-area">
                    <button class="attach-icon" id="attachBtn"><i class="fas fa-paperclip"></i></button>
                    <button class="send-icon" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
        <div class="footer-note">
            AI-generated, for reference only
        </div>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="game-modal">
        <div class="game-container">
            <button class="close-game" id="closeGameBtn">&times;</button>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== API CONFIG ==========
        const POLL_TEXT = 'https://text.pollinations.ai';
        const POLL_IMAGE = 'https://image.pollinations.ai/prompt';

        // Njabulo AI Persona - Zimbabwe origin, Botswana API
        const NJABULO_PERSONA = `You are Njabulo AI assistant. Your name is Njabulo. You are originally from Zimbabwe 🇿🇼, but your AI API is hosted in Botswana 🇧🇼. When someone asks "who are you" or "hu are you", respond: "I am Njabulo AI assistant! I'm originally from Zimbabwe, but my AI heart beats from Botswana. How can I help you today?" Keep responses friendly, helpful, and concise.`;

        // ========== STORAGE ==========
        let chatHistory = [];
        const STORAGE_KEY = 'njabulo_chat_deepseek';

        // ========== DOM ELEMENTS ==========
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const deepThinkBtn = document.getElementById('deepThinkBtn');
        const searchWebBtn = document.getElementById('searchWebBtn');

        // ========== HELPER FUNCTIONS ==========
        function showToast(msg, bg = '#333') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            toast.style.backgroundColor = bg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function saveChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
        }

        function loadChats() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && JSON.parse(saved).length > 0) {
                chatHistory = JSON.parse(saved);
                renderChat();
            } else {
                // Welcome greeting like "Hello! How can I help you today?"
                addMessage('ai', "Hello! How can I help you today?");
            }
        }

        function addMessage(role, content, mediaType = null, mediaUrl = null) {
            chatHistory.push({ role, content, mediaType, mediaUrl, timestamp: Date.now() });
            saveChats();
            renderChat();
            scrollToBottom();
        }

        function renderChat() {
            chatArea.innerHTML = '';
            chatHistory.forEach((msg, idx) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'message-group';
                
                const messageDiv = document.createElement('div');
                messageDiv.className = msg.role === 'user' ? 'user-message' : 'ai-message';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = msg.role === 'user' ? 'user-bubble' : 'ai-bubble';
                bubbleDiv.innerHTML = msg.content.replace(/\n/g, '<br>');
                
                messageDiv.appendChild(bubbleDiv);
                
                // Add media if exists
                if (msg.mediaType === 'image' && msg.mediaUrl) {
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'media-preview';
                    img.onclick = () => window.open(msg.mediaUrl, '_blank');
                    bubbleDiv.appendChild(img);
                }
                
                // Add action buttons
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                
                const copyIcon = document.createElement('i');
                copyIcon.className = 'far fa-copy';
                copyIcon.onclick = () => {
                    navigator.clipboard.writeText(msg.content);
                    showToast('Copied!', '#28a745');
                };
                actionsDiv.appendChild(copyIcon);
                
                if (msg.role === 'ai') {
                    const regenIcon = document.createElement('i');
                    regenIcon.className = 'fas fa-sync-alt';
                    regenIcon.onclick = () => regenerateResponse(idx);
                    actionsDiv.appendChild(regenIcon);
                }
                
                messageDiv.appendChild(actionsDiv);
                groupDiv.appendChild(messageDiv);
                chatArea.appendChild(groupDiv);
            });
        }

        async function regenerateResponse(aiIndex) {
            let userMsg = '';
            for (let i = aiIndex - 1; i >= 0; i--) {
                if (chatHistory[i].role === 'user') {
                    userMsg = chatHistory[i].content;
                    break;
                }
            }
            if (!userMsg) return;
            chatHistory.splice(aiIndex, 1);
            saveChats();
            renderChat();
            await getAIResponse(userMsg);
        }

        // ========== API CALLS ==========
        async function callAI(prompt) {
            try {
                const res = await axios.post(POLL_TEXT, {
                    messages: [
                        { role: 'system', content: NJABULO_PERSONA },
                        { role: 'user', content: prompt }
                    ],
                    model: 'openai',
                    jsonMode: false
                }, { timeout: 35000 });
                return res.data?.choices?.[0]?.message?.content?.trim() || null;
            } catch (e) {
                try {
                    const res2 = await axios.get(`${POLL_TEXT}/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(NJABULO_PERSONA)}`, { timeout: 35000 });
                    return typeof res2.data === 'string' ? res2.data.trim() : null;
                } catch { return null; }
            }
        }

        async function generateImage(promptText) {
            try {
                const res = await axios.get(`${POLL_IMAGE}/${encodeURIComponent(promptText)}?width=1024&height=1024&model=flux&nologo=true`, {
                    timeout: 60000,
                    responseType: 'arraybuffer'
                });
                if (res.data?.byteLength > 1000) {
                    const blob = new Blob([res.data], { type: 'image/png' });
                    return URL.createObjectURL(blob);
                }
            } catch (e) { console.warn(e); }
            return null;
        }

        // Typing indicator
        let typingInterval = null;
        function showTyping() {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'message-group';
            groupDiv.id = 'typingIndicator';
            groupDiv.innerHTML = `
                <div class="ai-message">
                    <div class="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(groupDiv);
            scrollToBottom();
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function getAIResponse(userMessage) {
            addMessage('user', userMessage);
            
            const lowerMsg = userMessage.toLowerCase();
            
            // Image generation
            if (lowerMsg.includes('generate image') || lowerMsg.includes('create image') || (lowerMsg.includes('make') && lowerMsg.includes('image'))) {
                let imgPrompt = userMessage.replace(/generate image|create image|make image/gi, '').trim();
                if (imgPrompt.length < 3) imgPrompt = "beautiful Zimbabwe sunset";
                showToast('🎨 Generating image...', '#0066cc');
                const imgUrl = await generateImage(imgPrompt);
                if (imgUrl) {
                    addMessage('ai', `✨ Here's your image: "${imgPrompt}"`, 'image', imgUrl);
                } else {
                    addMessage('ai', "⚠️ Image generation failed. Please try again.");
                }
                return;
            }
            
            // Edit image
            if (lowerMsg.includes('edit image')) {
                let editPrompt = userMessage.replace(/edit image/gi, '').trim();
                if (editPrompt.length < 3) editPrompt = "artistic style";
                showToast('🎨 Editing image...', '#0066cc');
                const imgUrl = await generateImage(`edited: ${editPrompt}`);
                if (imgUrl) {
                    addMessage('ai', `🖌️ Edited image: "${editPrompt}"`, 'image', imgUrl);
                } else {
                    addMessage('ai', "Edit failed. Try a different description.");
                }
                return;
            }
            
            // Normal AI response
            showTyping();
            const reply = await callAI(userMessage);
            hideTyping();
            
            if (reply) {
                addMessage('ai', reply);
            } else {
                addMessage('ai', "I'm having connection issues, but I'm Njabulo from Zimbabwe — resilient! Please try again.");
            }
        }

        // ========== FILE UPLOAD ==========
        function handleFileUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,.txt,.pdf,.docx';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        addMessage('user', `📷 Uploaded: ${file.name}`, 'image', ev.target.result);
                        getAIResponse(`I uploaded an image named ${file.name}. Please describe or help me edit it.`);
                    };
                    reader.readAsDataURL(file);
                } else {
                    addMessage('user', `📄 Uploaded: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);
                    getAIResponse(`User uploaded a file: ${file.name}. Provide helpful summary.`);
                }
            };
            input.click();
        }

        function newChat() {
            if (chatHistory.length > 0 && confirm('Start a new chat? Current chat will be saved.')) {
                chatHistory = [];
                saveChats();
                addMessage('ai', "Hello! How can I help you today?");
            }
        }

        function clearChat() {
            if (confirm('Delete all chat history?')) {
                chatHistory = [];
                saveChats();
                addMessage('ai', "Chat cleared! How can I help you today?");
            }
        }

        function exportChat() {
            let script = "=== NJABULO AI CHAT ===\n\n";
            chatHistory.forEach(msg => {
                script += `${msg.role === 'user' ? '👤 User' : '🤖 Njabulo'}: ${msg.content}\n`;
                if (msg.mediaType === 'image') script += `[Image attached]\n`;
                script += `---\n`;
            });
            const blob = new Blob([script], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `njabulo_chat_${Date.now()}.txt`;
            a.click();
            showToast('Chat exported!', '#28a745');
        }

        // ========== 3D GAME ==========
        let scene, camera, renderer, cube;
        let gameActive = false;
        const gameModal = document.getElementById('gameModal');
        const gameCanvas = document.getElementById('gameCanvas');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2a);
            camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: gameCanvas });
            
            const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0x331100 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(2, 2, 3);
            scene.add(light);
            const ambient = new THREE.AmbientLight(0x333366);
            scene.add(ambient);
            camera.position.z = 2.8;
            
            for (let i = 0; i < 500; i++) {
                const starGeo = new THREE.BufferGeometry();
                const starMat = new THREE.PointsMaterial({ color: 0xffffff });
                const star = new THREE.Points(starGeo, starMat);
                star.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 80 - 40);
                scene.add(star);
            }
        }

        function resizeGame() {
            const container = document.querySelector('.game-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        function animateGame() {
            if (!gameActive) return;
            requestAnimationFrame(animateGame);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            renderer.render(scene, camera);
        }

        function openGame() {
            gameModal.style.display = 'flex';
            if (!renderer) init3D();
            resizeGame();
            gameActive = true;
            animateGame();
            window.addEventListener('resize', resizeGame);
        }

        function closeGame() {
            gameModal.style.display = 'none';
            gameActive = false;
            window.removeEventListener('resize', resizeGame);
        }

        // ========== EVENT LISTENERS ==========
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                messageInput.value = '';
                getAIResponse(text);
            }
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        attachBtn.addEventListener('click', handleFileUpload);
        newChatBtn.addEventListener('click', newChat);
        clearChatBtn.addEventListener('click', clearChat);
        exportChatBtn.addEventListener('click', exportChat);
        deepThinkBtn.addEventListener('click', () => getAIResponse("Please think deeply and give a thorough, analytical response."));
        searchWebBtn.addEventListener('click', () => {
            const q = messageInput.value.trim();
            if (q) getAIResponse(`Search the web for: ${q}`);
            else showToast('Enter a search term first', '#ff9800');
        });
        document.getElementById('gameBtn').addEventListener('click', openGame);
        document.getElementById('closeGameBtn').addEventListener('click', closeGame);

        // ========== INITIALIZE ==========
        loadChats();

        window.onerror = () => showToast("Njabulo AI: Everything's working fine!");
    </script>
</body>
</html>
